# Home Base: send sound to the TV over HDMI rather than the headphone jack, with room to spare: a Pi's HDMI output
# with no headroom ran dry whenever the CPU stalled for a moment (a video's sound cut out while its picture went on).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*hdmi.*" } ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver = 2000
        api.alsa.headroom = 2048
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
