<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Base</title>
<link rel="stylesheet" href="app.css">
</head>
<body data-wallpaper="ambient">

<div id="starting" hidden aria-live="polite">
  <div class="bg"></div>
  <div class="box"><div class="spinner" aria-hidden="true"></div><div class="label">Starting</div><div id="starting-title"></div></div>
</div>

<div id="wallpaper" aria-hidden="true">
  <canvas class="ambient" width="160" height="90"></canvas>
  <div class="art"></div>
  <div class="shade"></div>
</div>

<div id="stage">

  <!-- ================================================================ SETUP -->
  <section id="view-setup" class="view" aria-label="Setup">
    <div class="setup" id="setup-body"></div>
  </section>

  <!-- ================================================================ HOME -->
  <section id="view-home" class="view" aria-label="Home">
    <header class="home-header">
      <div>
        <div class="clock"><span id="clock-time">--:--</span><span class="ampm" id="clock-ampm"></span></div>
        <div class="date" id="clock-date"></div>
      </div>
      <div class="home-right">
        <div class="weather" id="weather"></div>
        <div class="home-chips">
          <span class="chip" id="chip-net" hidden>
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/></svg>
            <span id="chip-net-text">…</span>
          </span>
        </div>
      </div>
    </header>

    <div class="menu" id="menu" role="menu" aria-label="Settings and power">
      <button role="menuitem" data-action="settings">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        Settings
      </button>
      <button role="menuitem" data-action="reboot">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Restart
      </button>
      <button role="menuitem" data-action="poweroff">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
        Power off
      </button>
    </div>

    <main class="home-main">
      <h2 class="section-label">Watch &amp; listen</h2>
      <div class="tiles">
        <button class="tile yt" data-action="youtube">
          <span class="art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span>
          <span class="name">YouTube</span>
          <span class="sub">Subscriptions, search, playlists</span>
        </button>
        <button class="tile plex" data-action="plex">
          <span class="art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M3 15h18M8 5v4M16 5v4M8 15v4M16 15v4"/></svg></span>
          <span class="name">Plex</span>
          <span class="sub" id="tile-plex-sub">Movies and shows</span>
        </button>
        <button class="tile music" data-action="music">
          <span class="art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
          <span class="name">Music</span>
          <span class="sub" id="tile-music-sub">Your music, with visualizers</span>
        </button>
        <button class="tile cast" data-action="cast">
          <span class="badge" id="cast-badge" hidden><i></i>Ready</span>
          <span class="art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/><path d="M3 12a8 8 0 0 1 8 8"/><path d="M3 16a4 4 0 0 1 4 4"/></svg></span>
          <span class="name">Cast to TV</span>
          <span class="sub" id="tile-cast-sub">Send from the Plex app on your phone</span>
        </button>
      </div>
    </main>

    <footer class="home-foot">
      <div class="ticker" id="ticker" hidden>
        <div class="track"><div class="run" id="ticker-run"></div></div>
      </div>
      <button class="icon-btn" id="menu-btn" aria-label="Settings and power" aria-haspopup="menu" aria-expanded="false">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </footer>
  </section>

  <!-- ================================================================ SETTINGS -->
  <section id="view-settings" class="view" aria-label="Settings">
    <header class="page-header">
      <button class="pill" data-action="home">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Home
      </button>
      <h1>Settings</h1>
    </header>
    <div class="page-body">
      <nav class="side-nav" id="settings-nav">
        <button data-tab="network"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/></svg>Network</button>
        <button data-tab="display"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Display</button>
        <button data-tab="appearance"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18c1.5 0 2-1 2-2s-1-1.5-1-2.5S14 15 15 15h2a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>Appearance</button>
        <button data-tab="home"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home screen</button>
        <button data-tab="system"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>System</button>
      </nav>
      <div class="panel" id="settings-panel"></div>
    </div>
  </section>

  <!-- ================================================================ YOUTUBE -->
  <section id="view-youtube" class="view" aria-label="YouTube">
    <header class="page-header">
      <button class="pill" data-action="home">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Home
      </button>
      <h1>YouTube</h1>
    </header>
    <div id="youtube-body" class="lib"></div>
  </section>

  <!-- ================================================================ PLEX -->
  <section id="view-plex" class="view" aria-label="Plex">
    <header class="page-header">
      <button class="pill" data-action="home">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Home
      </button>
      <h1>Plex</h1>
      <span class="chip" id="plex-server" hidden>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6"/><circle cx="12" cy="16.5" r="1"/></svg>
        <span id="plex-server-name"></span>
      </span>
    </header>
    <div id="plex-body" class="lib"></div>
  </section>

  <!-- ================================================================ MUSIC -->
  <section id="view-music" class="view" aria-label="Music">
    <header class="page-header">
      <button class="pill" data-action="home">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Home
      </button>
      <h1>Music</h1>
      <button class="pill" id="music-mode-btn"></button>
      <span class="chip" id="music-server" hidden>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6"/><circle cx="12" cy="16.5" r="1"/></svg>
        <span id="music-server-name"></span>
      </span>
    </header>
    <div id="music-body" class="lib"></div>
  </section>

</div>

<div id="viz-full" aria-hidden="true"><canvas></canvas><div class="caption" id="viz-caption"></div></div>
<div id="dialog-backdrop"><div class="dialog" role="dialog" aria-modal="true" id="dialog"></div></div>
<div id="toast" role="status"></div>
<div id="volume-osd" role="status" aria-live="polite">
  <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <div class="bar"><i></i></div><span></span>
</div>
<audio id="player" preload="auto"></audio>

<script src="app.js"></script>
</body>
</html>
